[project]
name = "grok-claude-mcp"
version = "0.1.0"
description = "MCP para que Grok Bot delegue tareas de desarrollo a Claude Code y reciba un PR."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "claude-agent-sdk>=0.2.140,<0.3",
]

[project.scripts]
grok-claude-mcp = "grok_claude_mcp.servidor:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grok_claude_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
